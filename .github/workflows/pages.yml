name: Desplegar en GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Comprobar el motor
        working-directory: engine
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Construir el motor
        working-directory: engine
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar el sitio
        run: |
          mkdir -p _site
          tar --exclude=./_site --exclude=./.git --exclude=./engine -cf - . | tar -xf - -C _site
          mkdir -p _site/motor
          cp -r engine/dist/. _site/motor/

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # El entorno github-pages solo admite despliegues desde la rama por defecto.
  # En las ramas de trabajo el flujo hace de integracion continua (typecheck,
  # pruebas y empaquetado) y se queda ahi, en vez de terminar en rojo por una
  # restriccion que no tiene nada que ver con el codigo.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
